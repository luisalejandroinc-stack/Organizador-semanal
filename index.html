<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planificador Semanal Minimalista — Bullet Journal Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfDvsmGWi0kgRVAiAKBJY7jXXr8tYt7yY",
      authDomain: "bujo-personal.firebaseapp.com",
      projectId: "bujo-personal",
      storageBucket: "bujo-personal.firebasestorage.app",
      messagingSenderId: "840793301454",
      appId: "1:840793301454:web:fa9d565f503102d73ecb9f",
      measurementId: "G-2K4E508Q4B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.db = db;
    window.doc = doc;
    window.onSnapshot = onSnapshot;
    window.setDoc = setDoc;
    window.auth = auth;

    window.loginWithGoogle = () => {
      signInWithPopup(auth, provider).catch(err => alert("Error al iniciar sesión: " + err.message));
    };

    window.logoutGoogle = () => {
      signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      window.currentUser = user;
      const authBtn = document.getElementById("auth-btn");
      const userBadge = document.getElementById("user-badge");

      if (user) {
        if (authBtn) {
          authBtn.textContent = "Cerrar sesión";
          authBtn.onclick = window.logoutGoogle;
          authBtn.className = "px-2.5 py-1 text-xs font-medium text-zinc-600 hover:text-zinc-900 border border-zinc-200 rounded transition";
        }
        if (userBadge) {
          userBadge.textContent = user.displayName || user.email;
          userBadge.classList.remove("hidden");
        }
        window.initCloudSync();
      } else {
        if (authBtn) {
          authBtn.innerHTML = `
            <svg class="w-3.5 h-3.5 inline mr-1" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h5.51c-.24 1.27-.99 2.35-2.09 3.07v2.54h3.38c1.98-1.82 3.12-4.51 3.12-7.58c0-.64-.06-1.25-.17-1.84z"/><path fill="currentColor" d="M12.18 21c2.83 0 5.21-.94 6.95-2.56l-3.38-2.54c-.94.63-2.14 1-3.57 1c-2.74 0-5.06-1.85-5.89-4.34H2.78v2.62C4.54 18.66 8.09 21 12.18 21z"/><path fill="currentColor" d="M6.29 12.56c-.21-.63-.33-1.3-.33-2c0-.7.12-1.37.33-2V5.94H2.78C2.07 7.36 1.67 8.94 1.67 10.56s.4 3.2 1.11 4.62l3.51-2.62z"/><path fill="currentColor" d="M12.18 4.64c1.54 0 2.92.53 4.01 1.57l3.01-3.01C17.38 1.48 15 0.5 12.18 0.5c-4.09 0-7.64 2.34-9.4 5.44l3.51 2.62c.83-2.49 3.15-4.34 5.89-4.34z"/></svg>
            Entrar con Google
          `;
          authBtn.onclick = window.loginWithGoogle;
          authBtn.className = "px-2.5 py-1 text-xs font-medium text-white bg-zinc-900 hover:bg-zinc-800 rounded transition flex items-center";
        }
        if (userBadge) {
          userBadge.classList.add("hidden");
        }
        flashSaveIndicator("Inicia sesión para sincronizar");
      }
    });
  </script>

  <style>
    :root {
      --grid-size: 24px;
      --grid-line: #e4e4e7;
      --ink-black: #18181b;
      --paper-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: var(--ink-black);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .bujo-sheet {
      max-width: 1020px;
      margin: 24px auto 48px auto;
      background: var(--paper-bg);
      padding: 44px 48px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.12), 0 0 1px 1px rgba(0, 0, 0, 0.05);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .bujo-sheet {
        margin: 12px;
        padding: 20px 16px;
      }
    }

    .bujo-section-title {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #18181b;
      margin-bottom: 6px;
      user-select: none;
    }

    .thick-rule {
      border-top: 2.5px solid #18181b;
    }

    .grid-paper {
      background-size: 24px 24px;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      border-right: 1px solid var(--grid-line);
      border-bottom: 1px solid var(--grid-line);
    }

    .bujo-day-textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-size: 0.85rem;
      line-height: 24px;
      padding: 0 10px 0 34px;
      color: #18181b;
      overflow-y: auto;
    }

    .bujo-notes-textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-size: 0.85rem;
      line-height: 24px;
      padding: 0 8px;
      color: #18181b;
    }

    .bujo-line-input {
      width: 100%;
      height: 28px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.84rem;
      color: #18181b;
      padding: 0 4px;
    }

    .bujo-line-input::placeholder,
    .bujo-day-textarea::placeholder,
    .bujo-notes-textarea::placeholder {
      color: #d4d4d8;
      font-weight: 400;
    }

    .mes-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.75rem;
    }
    .mes-table th {
      background-color: #9ca3af;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.22em;
      padding: 5px 0;
      border: 1px solid #9ca3af;
      text-align: center;
    }
    .mes-table td {
      border: 1px solid #d4d4d8;
      height: 24px;
      text-align: center;
      user-select: none;
      transition: all 0.12s ease;
    }
    .mes-table td.trimestre-label {
      font-weight: 700;
      color: #18181b;
      background-color: #fafafa;
      cursor: default;
    }
    .mes-table td.month-cell {
      cursor: pointer;
      color: #27272a;
    }
    .mes-table td.month-cell:hover {
      background-color: #f4f4f5;
    }
    .mes-table td.month-cell.active-month {
      background-color: #18181b;
      color: #ffffff;
      font-weight: 600;
    }

    .mini-cal-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .mini-cal-table th {
      font-size: 0.72rem;
      font-weight: 700;
      color: #18181b;
      padding-bottom: 4px;
      text-align: center;
      border-bottom: 2.5px solid #18181b;
      user-select: none;
    }
    .mini-cal-table td {
      border: 1px solid #d4d4d8;
      height: 23px;
      text-align: center;
      font-size: 0.7rem;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: background-color 0.1s ease;
    }
    .mini-cal-table td:hover {
      background-color: #f4f4f5;
    }
    .mini-cal-table td.other-month {
      color: #d4d4d8;
    }
    .mini-cal-table td.active-week-row {
      background-color: #f4f4f5;
      font-weight: 600;
    }
    .mini-cal-table td.marked-day {
      background-color: #18181b !important;
      color: #ffffff !important;
      font-weight: 600;
    }
    .mini-cal-table td.is-today::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 9999px;
      background-color: #71717a;
    }
    .mini-cal-table td.marked-day.is-today::after {
      background-color: #ffffff;
    }

    .habits-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .habits-table td {
      height: 28px;
      border-bottom: 1px solid #d4d4d8;
    }
    .habits-table td.habit-day-cell {
      width: 26px;
      border-left: 1px solid #d4d4d8;
      border-right: 1px solid #d4d4d8;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.12s ease;
    }
    .habits-table td.habit-day-cell:hover {
      background-color: #f4f4f5;
    }
    .habits-table td.habit-day-cell.checked {
      background-color: #27272a;
      color: #ffffff;
    }

    @media print {
      body {
        background: #ffffff;
      }
      .no-print {
        display: none !important;
      }
      .bujo-sheet {
        margin: 0;
        padding: 12mm 14mm;
        box-shadow: none;
        max-width: 100%;
        width: 100%;
      }
      .bujo-line-input::placeholder,
      .bujo-day-textarea::placeholder,
      .bujo-notes-textarea::placeholder {
        color: transparent !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <header class="no-print sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-zinc-200 px-4 py-2.5 shadow-sm">
    <div class="max-w-[1020px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 bg-zinc-900 text-white flex items-center justify-center font-bold text-xs tracking-wider rounded">
          BJ
        </div>
        <div>
          <h1 class="text-sm font-semibold text-zinc-900 leading-none">Bullet Journal Digital</h1>
          <div class="flex items-center gap-2 mt-1">
            <span id="save-indicator" class="inline-flex items-center gap-1 text-[11px] text-zinc-500 font-medium">

  <div id="clear-modal" class="no-print fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-xs p-4">

      <h3 class="text-sm font-semibold text-zinc-900">¿Limpiar esta página semanal?</h3>
      <p class="text-xs text-zinc-600 mt-1.5 leading-relaxed">
        Se borrarán las metas, notas diarias, tareas, hábitos y apuntes de la semana seleccionada (<span id="modal-week-label" class="font-medium text-zinc-800"></span>).

      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeClearModal()" class="px-3 py-1.5 text-xs font-medium text-zinc-700 bg-zinc-100 hover:bg-zinc-200 rounded-md transition">Cancelar</button>
        <button onclick="confirmClearPage()" class="px-3 py-1.5 text-xs font-medium text-white bg-rose-600 hover:bg-rose-700 rounded-md transition">Sí, limpiar hoja</button>
      </div>
    </div>
  </div>

  <script>
    const DAY_LETTERS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    const MONTH_NAMES = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    let store = { pages: {} };
    let currentWeekKey = getISOWeekString(new Date());
    let syncTimeout = null;
    let isLocalSaving = false;
    let unsubscribeSnapshot = null;

    function getISOWeekString(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function getMondayFromISOWeek(weekStr) {
      const [yearPart, weekPart] = weekStr.split('-W');
      const year = parseInt(yearPart, 10);
      const week = parseInt(weekPart, 10);
      const simple = new Date(year, 0, 1 + (week - 1) * 7);
      const dow = simple.getDay();
      const ISOweekStart = new Date(simple);
      if (dow <= 4 && dow > 0) {
        ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
      } else if (dow === 0) {
        ISOweekStart.setDate(simple.getDate() - 6);
      } else {
        ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
      }
      return ISOweekStart;
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function createEmptyPage(defaultMonthIndex) {
      return {
        goals: ['', '', '', ''],
        days: ['', '', '', '', '', '', ''],
        selectedMonth: typeof defaultMonthIndex === 'number' ? defaultMonthIndex : new Date().getMonth(),
        extraTrimesterNotes: ['', '', ''],
        markedCalendarDays: [],
        tasks: Array.from({ length: 6 }, () => ({ text: '', done: false })),
        habits: Array.from({ length: 6 }, () => ({
          name: '',
          checks: [false, false, false, false, false, false, false]
        })),
        notes: ''
      };
    }

    function getCurrentPage() {
      if (!store.pages[currentWeekKey]) {
        const mondayDate = getMondayFromISOWeek(currentWeekKey);
        store.pages[currentWeekKey] = createEmptyPage(mondayDate.getMonth());
      }
      return store.pages[currentWeekKey];
    }

    window.initCloudSync = function() {
      if (!window.db || !window.currentUser) return;
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const userDocRef = window.doc(window.db, "usuarios", window.currentUser.uid, "datos", "semanas");

      unsubscribeSnapshot = window.onSnapshot(userDocRef, (docSnap) => {
        // Ignorar el eco de nuestra propia escritura para no mover el cursor
        if (docSnap.metadata.hasPendingWrites || isLocalSaving) return;

        if (docSnap.exists()) {
          const cloudData = docSnap.data();
          if (cloudData && cloudData.pages) {
            store.pages = cloudData.pages;
            renderAll();
            flashSaveIndicator("Sincronizado en la nube");
          }
        }
      });
    };

    function saveStore() {
      if (!window.currentUser) {
        flashSaveIndicator("Inicia sesión para sincronizar");
        return;
      }

      isLocalSaving = true;
      flashSaveIndicator("Guardando...");
      clearTimeout(syncTimeout);
      syncTimeout = setTimeout(() => {
        if (window.db && window.currentUser) {
          const userDocRef = window.doc(window.db, "usuarios", window.currentUser.uid, "datos", "semanas");
          window.setDoc(userDocRef, { pages: store.pages }, { merge: true })
            .then(() => {
              flashSaveIndicator("Sincronizado en la nube");
              setTimeout(() => { isLocalSaving = false; }, 300);
            })
            .catch((err) => {
              console.error(err);
              isLocalSaving = false;
              flashSaveIndicator("Error al sincronizar");
            });
        }
      }, 600);
    }

    function renderGoals() {
      const page = getCurrentPage();
      const container = document.getElementById('goals-container');

      if (container.children.length === page.goals.length) {
        page.goals.forEach((goalText, idx) => {
          const input = container.children[idx].querySelector('input');
          if (input && document.activeElement !== input) {
            input.value = goalText;
          }
        });
        return;
      }

      container.innerHTML = '';
      page.goals.forEach((goalText, idx) => {
        const row = document.createElement('div');
        row.className = 'border-b border-zinc-300 flex items-center';
        row.innerHTML = `
          <input
            type="text"
            class="bujo-line-input"
            value="${escapeHtml(goalText)}"
            placeholder="Meta ${idx + 1}..."
            oninput="updateGoal(${idx}, this.value)"
          />
        `;
        container.appendChild(row);
      });
    }

    function renderDays() {
      const page = getCurrentPage();
      const monday = getMondayFromISOWeek(currentWeekKey);
      const container = document.getElementById('days-container');

      if (container.children.length === DAY_LETTERS.length) {
        DAY_LETTERS.forEach((letter, idx) => {
          const dayDate = new Date(monday);
          dayDate.setDate(monday.getDate() + idx);
          const dayNumber = dayDate.getDate();
          const monthShort = MONTH_NAMES[dayDate.getMonth()].slice(0, 3).toLowerCase();

          const block = container.children[idx];
          const dateBadge = block.querySelector('.day-date-badge');
          if (dateBadge) dateBadge.textContent = `${dayNumber} ${monthShort}`;

          const textarea = block.querySelector('textarea');
          if (textarea && document.activeElement !== textarea) {
            textarea.value = page.days[idx] || '';
          }
        });
        return;
      }

      container.innerHTML = '';
      DAY_LETTERS.forEach((letter, idx) => {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + idx);
        const dayNumber = dayDate.getDate();
        const monthShort = MONTH_NAMES[dayDate.getMonth()].slice(0, 3).toLowerCase();

        const block = document.createElement('div');
        block.className = 'thick-rule relative grid-paper border-l border-zinc-200 h-[120px]';
        block.innerHTML = `
          <div class="absolute top-0 left-0 w-[24px] h-[24px] bg-zinc-900 text-white text-[11px] font-bold flex items-center justify-center select-none z-10">
            ${letter}
          </div>
          <div class="day-date-badge no-print absolute top-0.5 right-2 text-[10px] font-medium text-zinc-400 select-none pointer-events-none">
            ${dayNumber} ${monthShort}
          </div>
          <textarea
            class="bujo-day-textarea"
            placeholder=""
            oninput="updateDayText(${idx}, this.value)"
          >${escapeHtml(page.days[idx])}</textarea>
        `;
        container.appendChild(block);
      });
    }

    function renderMesTable() {
      const page = getCurrentPage();
      const tbody = document.getElementById('mes-table-body');
      tbody.innerHTML = '';

      const trimesters = [
        { label: 'T1', months: [0, 1, 2] },
        { label: 'T2', months: [3, 4, 5] },
        { label: 'T3', months: [6, 7, 8] },
        { label: 'T4', months: [9, 10, 11] }
      ];

      trimesters.forEach(t => {
        const tr = document.createElement('tr');
        let html = `<td class="trimestre-label">${t.label}</td>`;
        t.months.forEach(mIdx => {
          const isSelected = page.selectedMonth === mIdx;
          html += `
            <td
              class="month-cell ${isSelected ? 'active-month' : ''}"
              title="${MONTH_NAMES[mIdx]}"
              onclick="selectMonth(${mIdx})"
            >
              ${mIdx + 1}
            </td>
          `;
        });
        tr.innerHTML = html;
        tbody.appendChild(tr);
      });

      const extraTr = document.createElement('tr');
      extraTr.innerHTML = `
        <td class="trimestre-label"></td>
        <td></td><td></td><td></td>
      `;
      tbody.appendChild(extraTr);
    }

    function renderMiniCalendar() {
      const page = getCurrentPage();
      const mondayOfSelectedWeek = getMondayFromISOWeek(currentWeekKey);
      const sundayOfSelectedWeek = new Date(mondayOfSelectedWeek);
      sundayOfSelectedWeek.setDate(mondayOfSelectedWeek.getDate() + 6);

      const year = mondayOfSelectedWeek.getFullYear();
      const month = page.selectedMonth;

      const firstDayOfMonth = new Date(year, month, 1);
      const startOffset = (firstDayOfMonth.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const todayKey = formatDateKey(new Date());
      const tbody = document.getElementById('mini-cal-body');
      tbody.innerHTML = '';

      let cellCounter = 0;
      for (let row = 0; row < 6; row++) {
        const tr = document.createElement('tr');
        for (let col = 0; col < 7; col++) {
          const td = document.createElement('td');
          const dayNum = cellCounter - startOffset + 1;

          if (dayNum >= 1 && dayNum <= daysInMonth) {
            const cellDate = new Date(year, month, dayNum);
            const dateKey = formatDateKey(cellDate);
            td.textContent = dayNum;

            if (cellDate >= mondayOfSelectedWeek && cellDate <= sundayOfSelectedWeek) {
              td.classList.add('active-week-row');
            }

            if (dateKey === todayKey) {
              td.classList.add('is-today');
            }

            if (page.markedCalendarDays.includes(dateKey)) {
              td.classList.add('marked-day');
            }

            td.onclick = () => toggleCalendarDay(dateKey);
          } else {
            td.classList.add('other-month');
          }

          tr.appendChild(td);
          cellCounter++;
        }
        tbody.appendChild(tr);
      }
    }

    function renderTasks() {
      const page = getCurrentPage();
      const container = document.getElementById('tasks-container');

      if (container.children.length === page.tasks.length) {
        page.tasks.forEach((task, idx) => {
          const row = container.children[idx];
          const btn = row.querySelector('button');
          const input = row.querySelector('input');

          if (btn) {
            btn.className = `w-3.5 h-3.5 rounded-[2px] border border-zinc-400 flex items-center justify-center text-[10px] transition ${
              task.done ? 'bg-zinc-900 border-zinc-900 text-white' : 'bg-transparent hover:border-zinc-700'
            }`;
            btn.innerHTML = task.done ? '✓' : '';
          }

          if (input) {
            input.className = `bujo-line-input flex-1 ${task.done ? 'line-through text-zinc-400' : ''}`;
            if (document.activeElement !== input) {
              input.value = task.text;
            }
          }
        });
        return;
      }

      container.innerHTML = '';
      page.tasks.forEach((task, idx) => {
        const row = document.createElement('div');
        row.className = 'border-b border-zinc-300 flex items-center gap-2 group';
        row.innerHTML = `
          <button
            type="button"
            onclick="toggleTaskDone(${idx})"
            class="w-3.5 h-3.5 rounded-[2px] border border-zinc-400 flex items-center justify-center text-[10px] transition ${
              task.done ? 'bg-zinc-900 border-zinc-900 text-white' : 'bg-transparent hover:border-zinc-700'
            }"
            title="Marcar tarea completada"
          >
            ${task.done ? '✓' : ''}
          </button>
          <input
            type="text"
            class="bujo-line-input flex-1 ${task.done ? 'line-through text-zinc-400' : ''}"
            value="${escapeHtml(task.text)}"
            placeholder="Tarea ${idx + 1}..."
            oninput="updateTaskText(${idx}, this.value)"
          />
        `;
        container.appendChild(row);
      });
    }

    function renderHabits() {
      const page = getCurrentPage();
      const tbody = document.getElementById('habits-body');

      if (tbody.children.length === page.habits.length) {
        page.habits.forEach((habit, hIdx) => {
          const tr = tbody.children[hIdx];
          const input = tr.querySelector('input');
          if (input && document.activeElement !== input) {
            input.value = habit.name;
          }
          const cells = tr.querySelectorAll('.habit-day-cell');
          for (let dIdx = 0; dIdx < 7; dIdx++) {
            if (cells[dIdx]) {
              cells[dIdx].className = `habit-day-cell ${habit.checks[dIdx] ? 'checked' : ''}`;
            }
          }
        });
        return;
      }

      tbody.innerHTML = '';
      page.habits.forEach((habit, hIdx) => {
        const tr = document.createElement('tr');
        let html = `
          <td class="pr-2">
            <input
              type="text"
              class="bujo-line-input"
              value="${escapeHtml(habit.name)}"
              placeholder="Hábito ${hIdx + 1}..."
              oninput="updateHabitName(${hIdx}, this.value)"
            />
          </td>
        `;

        for (let dIdx = 0; dIdx < 7; dIdx++) {
          const isChecked = habit.checks[dIdx];
          html += `
            <td
              class="habit-day-cell ${isChecked ? 'checked' : ''}"
              title="${DAY_LETTERS[dIdx]}"
              onclick="toggleHabitDay(${hIdx}, ${dIdx})"
            ></td>
          `;
        }

        tr.innerHTML = html;
        tbody.appendChild(tr);
      });
    }

    function renderNotes() {
      const page = getCurrentPage();
      const notesEl = document.getElementById('notes-textarea');
      if (document.activeElement !== notesEl) {
        notesEl.value = page.notes || '';
      }
    }

    function updateHeaderBadge() {
      const picker = document.getElementById('week-picker');
      picker.value = currentWeekKey;

      const monday = getMondayFromISOWeek(currentWeekKey);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const fmt = (d) => `${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0, 3)}`;
      const badge = document.getElementById('week-range-badge');
      badge.textContent = `${fmt(monday)} – ${fmt(sunday)} ${sunday.getFullYear()}`;
    }

    function updateGoal(idx, val) {
      const page = getCurrentPage();
      page.goals[idx] = val;
      saveStore();
    }

    function updateDayText(idx, val) {
      const page = getCurrentPage();
      page.days[idx] = val;
      saveStore();
    }

    function selectMonth(mIdx) {
      const page = getCurrentPage();
      page.selectedMonth = mIdx;
      saveStore();
      renderMesTable();
      renderMiniCalendar();
    }

    function toggleCalendarDay(dateKey) {
      const page = getCurrentPage();
      const pos = page.markedCalendarDays.indexOf(dateKey);
      if (pos === -1) {
        page.markedCalendarDays.push(dateKey);
      } else {
        page.markedCalendarDays.splice(pos, 1);
      }
      saveStore();
      renderMiniCalendar();
    }

    function updateTaskText(idx, val) {
      const page = getCurrentPage();
      page.tasks[idx].text = val;
      saveStore();
    }

    function toggleTaskDone(idx) {
      const page = getCurrentPage();
      page.tasks[idx].done = !page.tasks[idx].done;
      saveStore();
      renderTasks();
    }

    function updateHabitName(hIdx, val) {
      const page = getCurrentPage();
      page.habits[hIdx].name = val;
      saveStore();
    }

    function toggleHabitDay(hIdx, dIdx) {
      const page = getCurrentPage();
      page.habits[hIdx].checks[dIdx] = !page.habits[hIdx].checks[dIdx];
      saveStore();
      renderHabits();
    }

    function handleNotesInput(val) {
      const page = getCurrentPage();
      page.notes = val;
      saveStore();
    }

    function onWeekPickerChange(val) {
      if (!val) return;
      currentWeekKey = val;
      renderAll();
    }

    function shiftWeek(deltaWeeks) {
      const monday = getMondayFromISOWeek(currentWeekKey);
      monday.setDate(monday.getDate() + deltaWeeks * 7);
      currentWeekKey = getISOWeekString(monday);
      renderAll();
    }

    function goToCurrentWeek() {
      currentWeekKey = getISOWeekString(new Date());
      const page = getCurrentPage();
      page.selectedMonth = new Date().getMonth();
      saveStore();
      renderAll();
    }

    function openClearModal() {
      const badgeText = document.getElementById('week-range-badge').textContent;
      document.getElementById('modal-week-label').textContent = badgeText;
      const modal = document.getElementById('clear-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeClearModal() {
      const modal = document.getElementById('clear-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function confirmClearPage() {
      const monday = getMondayFromISOWeek(currentWeekKey);
      store.pages[currentWeekKey] = createEmptyPage(monday.getMonth());
      saveStore();
      renderAll();
      closeClearModal();
    }

    function flashSaveIndicator(msg) {
      const el = document.getElementById('save-indicator');
      if (!el) return;
      el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> ${msg}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderAll() {
      updateHeaderBadge();
      renderGoals();
      renderDays();
      renderMesTable();
      renderMiniCalendar();
      renderTasks();
      renderHabits();
      renderNotes();
    }

    window.onload = function () {
      renderAll();
    };
  </script>
</body>
</html>
